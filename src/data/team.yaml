# Team roster — transcribed verbatim from _webflow-export/team.html (Phase C1b).
#
# Source has no bios and no social links for any member (confirmed in build-context/
# components.md §5: photo + name + role, full stop). Only those four fields exist here.
#
# Ordering: the 11 real members follow the source's document order. "We're Hiring!" is
# placed last (record 12) per the C1b build brief, rather than preserved in its original
# mid-grid slot (it originally sat between Max Richter and Audrey Lennon, in the 3rd of 6
# two-up rows).
#
# Role text is transcribed verbatim, including inconsistent casing (e.g. Jordi
# Chapdelaine's role reads "Chief revenue Officer", lowercase "revenue" — a plausible
# authoring typo in the source, left as-is per the migration rule against rewriting ported
# copy). `alt` text is newly authored for this migration (the source ships alt="" on every
# headshot) and uses corrected, readable casing since it is not ported copy.
#
# Image filenames match src/assets/images/ exactly, including the source's own misspelled
# "JordiChapdelanie-FINAL.jpg" (the filename misspells "Chapdelaine" — kept as-is since
# renaming gains nothing; the displayed `name` below is spelled correctly).

